# Dioxus CLI (dx) project config -- replaces Trunk.toml.
# `dx serve --platform web` for dev (Makefile: serve-frontend),
# `dx build --release --platform web` for the container image.
[application]
name = "drone-frontend"
default_platform = "web"
# Static assets referenced via asset!() are bundled automatically; the
# favicon and CSS are linked from index.html and served from /assets.
asset_dir = "assets"

[web.app]
title = "Drone Convoy Tracker | DRONE OPS COMMAND"
base_path = ""

[web.watcher]
watch_path = ["src", "style", "index.html", "../../assets"]
reload_html = true

[web.resource]
style = ["style/main.css"]

[web.resource.dev]
# API proxy: same origin in dev so the browser sees /graphql on :8080.
# (dx serve --proxy is set in the Makefile so this stays declarative.)

[web.proxy]
backend = "http://localhost:8080"
